<svg width="200" height="290" viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(14, 100, 180)">
  <!-- Thruster trails (angled for speed) -->
  <ellipse cx="85" cy="266" rx="28" ry="10" fill="#2196F3" opacity="0.3"/>
  <ellipse cx="105" cy="270" rx="18" ry="7" fill="#64B5F6" opacity="0.2"/>
  <!-- Thruster pod -->
  <ellipse cx="95" cy="248" rx="36" ry="17" fill="#1E88E5"/>
  <ellipse cx="88" cy="258" rx="20" ry="9" fill="#42A5F5"/>
  <ellipse cx="106" cy="260" rx="14" ry="7" fill="#64B5F6" opacity="0.7"/>
  <!-- Body -->
  <rect x="52" y="142" width="96" height="90" rx="22" fill="white" stroke="#BBDEFB" stroke-width="2.5"/>
  <rect x="60" y="150" width="80" height="74" rx="16" fill="#F0F8FF" stroke="#DDEEFF" stroke-width="1"/>
  <circle cx="100" cy="164" r="14" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <circle cx="100" cy="164" r="8" fill="#2196F3"/>
  <circle cx="100" cy="164" r="4" fill="#64B5F6"/>
  <text x="100" y="211" text-anchor="middle" font-size="30" font-weight="800" fill="#1565C0" font-family="Arial, sans-serif">AI</text>
  <circle cx="52" cy="162" r="7" fill="#90CAF9" stroke="#BBDEFB" stroke-width="1.5"/>
  <circle cx="148" cy="162" r="7" fill="#90CAF9" stroke="#BBDEFB" stroke-width="1.5"/>
  <rect x="84" y="138" width="32" height="12" rx="6" fill="#E3F2FD" stroke="#BBDEFB" stroke-width="1.5"/>
  <!-- Head (slightly tilted forward for speed look) -->
  <rect x="46" y="56" width="108" height="90" rx="24" fill="white" stroke="#BBDEFB" stroke-width="2.5"/>
  <rect x="56" y="66" width="88" height="70" rx="14" fill="#0D47A1"/>
  <rect x="58" y="68" width="30" height="10" rx="5" fill="white" opacity="0.08"/>
  <!-- Determined squint eyes -->
  <ellipse cx="76" cy="92" rx="14" ry="10" fill="#1565C0" stroke="#1976D2" stroke-width="1"/>
  <ellipse cx="76" cy="92" rx="9" ry="6" fill="#42A5F5"/>
  <ellipse cx="76" cy="92" rx="5" ry="3" fill="#90CAF9"/>
  <circle cx="72" cy="90" r="2" fill="white" opacity="0.9"/>
  <ellipse cx="124" cy="92" rx="14" ry="10" fill="#1565C0" stroke="#1976D2" stroke-width="1"/>
  <ellipse cx="124" cy="92" rx="9" ry="6" fill="#42A5F5"/>
  <ellipse cx="124" cy="92" rx="5" ry="3" fill="#90CAF9"/>
  <circle cx="120" cy="90" r="2" fill="white" opacity="0.9"/>
  <!-- Focused tight smile -->
  <path d="M80 116 Q100 124 120 116" fill="none" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
  <!-- Ear left -->
  <rect x="28" y="78" width="20" height="32" rx="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <rect x="32" y="86" width="8" height="16" rx="4" fill="#42A5F5"/>
  <!-- Ear right -->
  <rect x="152" y="78" width="20" height="32" rx="9" fill="#1E88E5" stroke="#90CAF9" stroke-width="1.5"/>
  <rect x="160" y="86" width="8" height="16" rx="4" fill="#42A5F5"/>
  <!-- Left arm pushed back -->
  <rect x="20" y="155" width="22" height="50" rx="11" fill="white" stroke="#BBDEFB" stroke-width="2"/>
  <circle cx="31" cy="213" r="13" fill="white" stroke="#BBDEFB" stroke-width="2"/>
  <!-- Right arm thrust forward/up -->
  <rect x="157" y="135" width="22" height="50" rx="11" fill="white" stroke="#BBDEFB" stroke-width="2" transform="rotate(-20,168,160)"/>
  <circle cx="183" cy="126" r="13" fill="white" stroke="#BBDEFB" stroke-width="2"/>
  <line x1="177" y1="120" x2="177" y2="132" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="183" y1="117" x2="183" y2="133" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="189" y1="120" x2="189" y2="132" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
