<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body><div style="font-family: system-ui, sans-serif; font-size: 14px; color: #2c3e50;">
  <h2 style="color: #514AD7;">New Proposal Request</h2>
  <div style="padding: 20px; background: #f6f7fb; border-left: 4px solid #514AD7; border-radius: 8px;">
    <table role="presentation">
      <tbody><tr><td style="color:#888; width:140px;">Name</td><td><strong>{{from_name}}</strong></td></tr>
      <tr><td style="color:#888;">Email</td><td>{{from_email}}</td></tr>
      <tr><td style="color:#888;">Phone</td><td>{{phone}}</td></tr>
      <tr><td style="color:#888;">Attachment</td><td>{{attachment_name}}</td></tr>
    </tbody></table>
  </div>
  <div style="margin-top:20px; padding:20px; border:1px solid #e0e0e0; border-radius:8px;">
    <p style="color:#888; margin:0 0 8px;">Message</p>
    <p style="margin:0;">{{message}}</p>
  </div>
</div></body></html>
